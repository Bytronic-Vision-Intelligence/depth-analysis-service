mqtt:
    mqtt_ip: localhost
    mqtt_port: 1883

topics:
  - name: "receive_depth_image"
    topic: test/dummy_pointcloud/receive_depth_image
    is_subscribe: True
    is_trigger: True

  - name: "receive_hmi_instruction"
    topic: test/hmi/instruction
    is_subscribe: True
    is_trigger: True

  - name: "send_depth_analysis"
    topic: test/database/search/sku_data
    is_subscribe: False
    is_trigger: False

  - name: "receive_analysis_results"
    topic: test/database/search/matching_sku
    is_subscribe: True
    is_trigger: True

  - name: "request_cloud_list"
    topic: test/dummy_pointcloud/request_cloud
    is_subscribe: False
    is_trigger: False

  - name: "receive_cloud_list"
    topic: test/dummy_pointcloud/receive_cloud_list
    is_subscribe: True
    is_trigger: True

image_options:
  region_of_interest: [0,0,2500,3000]
  trim_value: 0.0325

database_options:
  database_name: "test_database"
  database_table: "test_table"