# depth-analysis-service: measure the subject in a depth image and publish
# what it found.
#
# This is the documented SHAPE of a depth-analysis-service configuration, and
# the copy that ships beside the binary in a release. It is not deployment
# config: service-orchestrator writes the real one and launches the binary
# pointed at it with --config, so one binary can serve several installations.
#
# Tracked as config.example.yaml, never as config.yaml. The orchestrator writes
# config.yaml into this directory, and a tracked one would be overwritten by
# every sync and then show as modified in a tree somebody is about to commit.

# Topic namespace for this installation.
project: project

mqtt:
  mqtt_ip: localhost
  mqtt_port: 1883
  qos: 1

  # Topics are looked up BY NAME, so a deployment can call them whatever it
  # likes but must keep these names:
  #
  #   receive_depth_image - a depth image arrives here and starts a
  #                         measurement.
  #   request_cloud_list  - what this service publishes its results to.
  #   receive_cloud_list  - the point-cloud list this service asked for.
  #
  # is_subscribe: this service listens on the topic
  # is_trigger:   a message here starts a unit of work
  topics:
    - name: receive_depth_image
      topic: project/camera/depth/image
      is_subscribe: true
      is_trigger: true

    - name: request_cloud_list
      topic: project/camera/depth/request_cloud
      is_subscribe: false
      is_trigger: false

    - name: receive_cloud_list
      topic: project/camera/depth/receive_cloud_list
      is_subscribe: true
      is_trigger: true

# Settings belonging to this service alone.
#
# These three were string literals in main.py. They name a customer's database
# and the table inside it, which is deployment configuration by any reading:
# hardcoded, one installation's values ship to every other installation.
service:
  database_name: churchill_database
  database_table: sku_table

# How much this service says. It writes no log files: it prints, the
# orchestrator forwards every line to project/logging/<service>, and
# logging-service is the only thing that writes to disk.
# DEBUG | INFO | WARNING | ERROR | CRITICAL
logging:
  level: INFO
