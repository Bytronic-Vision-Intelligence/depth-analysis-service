# depth-analysis-service: measure the subject in a depth image and publish its size.
#
# This is the documented SHAPE of the configuration, not deployment config:
# service-orchestrator writes the real one to app/configs/config.yaml (or
# config-N.yaml for a second instance) from the project's orchestrator config,
# and launches the service with --config pointing at it. That generated file
# is not tracked, so a site's topics and settings never end up in this
# repository.

mqtt:
  mqtt_ip: localhost
  mqtt_port: 1883

topics:
  - name: receive_depth_image          # the depth camera's image; triggers an analysis
    topic: project/camera/depth_1/image
    is_subscribe: true
    is_trigger: true
  - name: send_depth_analysis          # the measurements, sent on to the database search
    topic: project/depth_analysis/search/sku_data
    is_subscribe: false
    is_trigger: false
  - name: receive_analysis_results
    topic: project/database/search/matching_sku
    is_subscribe: true
    is_trigger: true

image_options:
  # [left, top, right, bottom] in pixels of the received image; the analysis
  # ignores everything outside it.
  region_of_interest: [0, 0, 2500, 3000]
  # [x, y] size of one pixel in mm. Required. For an LJ-S head, y is the line
  # pitch divided by the camera's interpolate_y.
  pixel_pitch_mm: [0.2, 0.2]

# What is measured: plate (default; everything above) or steak_thickness (below).
# analysis: plate

# --- analysis: steak_thickness (Dunbia Line 1, Gocator 2150 in part mode) ---------------------
# One height map per steak from camera-service (uint16 PNG, 0.01 mm, 0 = no data, belt = 0 mm;
# the pixel size and the part's timing come in its metadata, so image_options is not needed).
# Result: thickness (the thicker long edge's p90, taken as the back-fat edge M&S measures
# along), whole-steak median / min / max / p10 / p90, wedge (difference of the ends' medians,
# always reported); judged per SKU; trigger_time for verdict-service. No length / width / area:
# along the belt they depend on the belt speed, which is not known well enough.
#
# topics (by name):
#   receive_depth_image  camera-service's depth image, e.g. dunbia/camera/depth_1/image/raw
#   send_depth_analysis  the result, = verdict-service's depth input, e.g. dunbia/analysis/steak_3d/result
#   sku_update           the UI's sku_selection (is_subscribe: true, is_trigger: false)
#
# analysis: steak_thickness
# steak_thickness:
#   selected_sku: sirloin_standard   # until the UI sends a selection
#   not_measurable_verdict: fail     # no steak in the map (e.g. the part timed out): fail or pass
#   # Limits per SKU as [low, high] in mm; the UI's sku_spec (sku_selection) wins on a clash.
#   # thickness is judged on thickness_mm, wedge on wedge_mm. A limit that is not set is not
#   # judged: wedge has no number in any M&S spec ("wedge steaks not permitted"), so it is off
#   # until one is agreed.
#   # thickness_method: edge (default; the thicker long edge, M&S "measured along the back fat":
#   # sirloin, ribeye, rump, picanha) or centre (the steak's core: fillet, ruler at the middle).
#   sku_spec_defaults:
#     sirloin_standard: {thickness: [15, 25]}
#     sirloin_AA: {thickness: [15, 25]}
#     sirloin_thin_cut: {thickness: [5, 15]}
#     ribeye_standard: {thickness: [15, 25]}
#     ribeye_AA: {thickness: [15, 25]}
#     ribeye_thick_cut: {thickness: [30, 40]}
#     fillet_standard: {thickness: [20, 40], thickness_method: centre}   # the only fillet SKU
#     rump_standard: {thickness: [20, 35]}
#     picanha: {thickness: [15, 30]}
#   # Measurement settings (defaults shown)
#   grid_mm: 1.0                # resampled to square pixels of this size
#   min_height_mm: 3.0          # higher than this above the belt is steak
#   min_area_mm2: 2000          # smaller patches are not a steak
#   close_mm: 3.0               # no-data specks up to this size inside the steak are closed
#   rim_mm: 3.0                 # edge left out of every reading (slope, rounded fat, shadows)
#   edge_band_mm: 5.0           # long-edge band depth, inside the rim (3-8 mm in)
#   edge_percentile: 90         # each band's reading: the fat's height, not the dip beside it
#   edge_middle_fraction: 0.6   # the edge bands cover this middle share of the length
#   end_fraction: 0.2           # each end (for the wedge) is this share of the length
#   centre_fraction: 0.5        # centre = farther from the outline than this share of the deepest point
#   min_points: 20              # fewest 1 mm grid points for a reading
