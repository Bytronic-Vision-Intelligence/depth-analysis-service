broker_details:
  mqtt_ip: localhost
  mqtt_port: 1883
topics:
- name: receive_depth_image
  topic: churchill/camera/depth_1/image
  is_subscribe: true
  is_trigger: true
- name: send_depth_analysis
  topic: churchill/depth_analysis/search/sku_data
  is_subscribe: false
  is_trigger: false
- name: receive_analysis_results
  topic: churchill/database/search/matching_sku
  is_subscribe: true
  is_trigger: true
image_options:
  region_of_interest:
  - 0
  - 0
  - 2500
  - 3000
  # [x, y] size of one pixel in mm, y is the LJ-S line pitch divided by interpolate_y
  # LJ-S640 on churchill: dwPitchX = 20000 and dwPitchY = 80000 (0.01um), interpolate_y 4
  pixel_pitch_mm: [0.2, 0.2]
